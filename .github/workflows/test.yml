# Tests on every push and pull request: the web app and its server, and the
# Android app's unit tests. The Docker workflow runs them too before it
# publishes an image; nothing is deployed or published from here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit; the comment names its release.
jobs:
  web:
    name: Web app and server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No dependency needs an install script.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check
      - name: Production build
        run: npm run build

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --no-audit --no-fund --ignore-scripts
      # The web bundle and the Capacitor plugin projects the Gradle build needs.
      - name: Web bundle into the Android project
        run: npm run android:sync
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
