# Publishes the Docker image to the GitHub Container Registry for every
# version tag vX.Y.Z: ghcr.io/<owner>/calendar-ce with the tags X.Y.Z, X.Y, X
# and latest, for linux/amd64 and linux/arm64. The tests run first and the
# tag has to match the version in package.json; nothing is published
# otherwise. Started by hand (workflow_dispatch), it builds both platforms
# without publishing anything.
name: Docker image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a commit; the comment names its release.
jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  image:
    name: Build and publish the image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
            exit 1
          fi

      # Registry names are lower case, whatever the owner's name looks like.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calendar-ce" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z, X.Y and X; "latest" follows the newest release. A manual
          # run (no tag) gets a sha-<commit> tag that is never pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=Calendar CE
            org.opencontainers.image.description=Calendar Community Edition: calendar and tasks kept on the device or on your own CalDAV server
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=patryk.pro
          annotations: |
            org.opencontainers.image.title=Calendar CE
            org.opencontainers.image.description=Calendar Community Edition: calendar and tasks kept on the device or on your own CalDAV server
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Sign in to the GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A build record and the list of packages in the image, stored next to it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # A cache that cannot be saved slows the next build, it does not fail this one.
          cache-to: type=gha,mode=max,ignore-error=true
