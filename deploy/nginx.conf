# nginx in front of the `calendar` service (Docker or deploy/calendar.service).
# Goes into /etc/nginx/sites-available/ (or conf.d/). Replace
# calendar.example.com and the certificate paths with your own (certbot
# writes them under /etc/letsencrypt/live/<name>/). nginx passes the server's
# own headers (Content-Security-Policy, HSTS and the rest) through unchanged;
# add no security headers here, or the browser gets two policies.

# The access log keeps the path only, never the query.
log_format calendar '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name calendar.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name calendar.example.com;

    ssl_certificate     /etc/letsencrypt/live/calendar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.example.com/privkey.pem;
    # Mozilla's "intermediate" profile without the DHE suites (no dhparam
    # file needed): forward secrecy and AEAD only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:calendar_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/calendar.access.log calendar;

    # The DAV proxy takes request bodies of up to 10 MiB, and each relayed
    # request may take 90 s.
    client_max_body_size 11m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # The DAV proxy compares the Host with the Origin of browsers that send no Sec-Fetch-Site.
        proxy_set_header Host $host;
        # nginx's entry is the only one the client cannot forge: CALENDAR_TRUST_PROXY=1.
        # Behind a CDN as well, count it too. Do not use the real_ip module as
        # well: the count would no longer hold.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Relayed CalDAV answers are passed on as they come.
        proxy_buffering off;
    }
}
